<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a20"/>
      <stop offset="50%" stop-color="#14143a"/>
      <stop offset="100%" stop-color="#1b0e3b"/>
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="50%" stop-color="#ffb199"/>
      <stop offset="100%" stop-color="#ffea79"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CBF"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad7)"/>

  <!-- Grid lines -->
  <g stroke="rgba(124, 92, 191, 0.15)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Cloud Base -->
  <g filter="drop-shadow(0 0 25px rgba(0, 242, 254, 0.4))">
    <ellipse cx="400" cy="330" rx="220" ry="50" fill="#1e1b4b" stroke="#00f2fe" stroke-width="2"/>
    <ellipse cx="320" cy="310" rx="100" ry="40" fill="#2d225a"/>
    <ellipse cx="480" cy="310" rx="90" ry="38" fill="#2d225a"/>
    <ellipse cx="400" cy="300" rx="130" ry="45" fill="#311e68"/>
  </g>

  <!-- Server Towers -->
  <g>
    <!-- Server Left -->
    <rect x="180" y="240" width="70" height="130" rx="8" fill="#131131" stroke="#7C5CBF" stroke-width="2"/>
    <line x1="190" y1="265" x2="240" y2="265" stroke="#00f2fe" stroke-width="3"/>
    <circle cx="200" cy="290" r="4" fill="#00f2fe"/>
    <circle cx="215" cy="290" r="4" fill="#22c55e"/>
    <circle cx="230" cy="290" r="4" fill="#a855f7"/>
    <line x1="190" y1="315" x2="240" y2="315" stroke="#7C5CBF" stroke-width="2"/>
    <circle cx="200" cy="340" r="4" fill="#00f2fe"/>
    <circle cx="215" cy="340" r="4" fill="#22c55e"/>

    <!-- Server Right -->
    <rect x="550" y="240" width="70" height="130" rx="8" fill="#131131" stroke="#7C5CBF" stroke-width="2"/>
    <line x1="560" y1="265" x2="610" y2="265" stroke="#00f2fe" stroke-width="3"/>
    <circle cx="570" cy="290" r="4" fill="#22c55e"/>
    <circle cx="585" cy="290" r="4" fill="#00f2fe"/>
    <circle cx="600" cy="290" r="4" fill="#a855f7"/>
    <line x1="560" y1="315" x2="610" y2="315" stroke="#7C5CBF" stroke-width="2"/>
    <circle cx="570" cy="340" r="4" fill="#22c55e"/>
    <circle cx="585" cy="340" r="4" fill="#00f2fe"/>
  </g>

  <!-- Rocket Fire Exhaust -->
  <polygon points="380,240 420,240 400,340" fill="url(#fireGrad)" opacity="0.9"/>
  <ellipse cx="400" cy="310" rx="30" ry="12" fill="#ffea79" opacity="0.8"/>

  <!-- Rocket Body -->
  <g transform="translate(400,160)">
    <!-- Wings -->
    <polygon points="-50,30 -20,-10 -20,50" fill="#a855f7"/>
    <polygon points="50,30 20,-10 20,50" fill="#a855f7"/>
    <!-- Fuselage -->
    <path d="M-25,50 C-25,-30 0,-100 0,-100 C0,-100 25,-30 25,50 Z" fill="url(#rocketGrad)" stroke="#ffffff" stroke-width="2"/>
    <!-- Window -->
    <circle cx="0" cy="-20" r="14" fill="#0f172a" stroke="#00f2fe" stroke-width="3"/>
    <circle cx="0" cy="-20" r="8" fill="#38bdf8"/>
    <!-- Tip Fin -->
    <polygon points="-4,-100 4,-100 0,-120" fill="#ff0844"/>
  </g>

  <!-- Badges / Telemetry -->
  <g>
    <rect x="80" y="80" width="180" height="46" rx="23" fill="rgba(30, 27, 75, 0.85)" stroke="#22c55e" stroke-width="2"/>
    <circle cx="105" cy="103" r="10" fill="#22c55e"/>
    <text x="125" y="108" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#ffffff">DEPLOY: LIVE</text>

    <rect x="540" y="80" width="180" height="46" rx="23" fill="rgba(30, 27, 75, 0.85)" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="565" cy="103" r="10" fill="#00f2fe"/>
    <text x="585" y="108" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#ffffff">STATUS: 200 OK</text>
  </g>
</svg>
