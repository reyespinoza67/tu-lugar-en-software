<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a1a"/>
      <stop offset="50%" stop-color="#14112e"/>
      <stop offset="100%" stop-color="#1e0f3d"/>
    </linearGradient>
    <linearGradient id="gearGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="gearGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b9a3e3"/>
      <stop offset="100%" stop-color="#7c5cbf"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad8)"/>

  <!-- Matrix circuit grid -->
  <g stroke="rgba(185, 163, 227, 0.12)" stroke-width="1.5">
    <path d="M 50 100 L 250 100 L 290 140 L 500 140"/>
    <path d="M 100 350 L 320 350 L 350 320 L 700 320"/>
    <path d="M 600 80 L 650 130 L 750 130"/>
    <circle cx="250" cy="100" r="4" fill="#00f2fe"/>
    <circle cx="500" cy="140" r="4" fill="#a855f7"/>
    <circle cx="350" cy="320" r="4" fill="#22c55e"/>
  </g>

  <!-- Big Central Gear Wheel -->
  <g transform="translate(380, 225)" filter="drop-shadow(0 0 20px rgba(0, 242, 254, 0.35))">
    <circle cx="0" cy="0" r="105" fill="none" stroke="url(#gearGrad1)" stroke-width="26" stroke-dasharray="28 14"/>
    <circle cx="0" cy="0" r="65" fill="#141432" stroke="#00f2fe" stroke-width="3"/>
    <circle cx="0" cy="0" r="28" fill="#1e1b4b" stroke="#7c5cbf" stroke-width="3"/>
  </g>

  <!-- Interlocking Secondary Gear Wheel -->
  <g transform="translate(520, 140)" filter="drop-shadow(0 0 15px rgba(185, 163, 227, 0.3))">
    <circle cx="0" cy="0" r="68" fill="none" stroke="url(#gearGrad2)" stroke-width="18" stroke-dasharray="20 10"/>
    <circle cx="0" cy="0" r="42" fill="#141432" stroke="#b9a3e3" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="18" fill="#1e1b4b"/>
  </g>

  <!-- Security Shield & Checkmark -->
  <g transform="translate(240, 230)" filter="drop-shadow(0 0 25px rgba(34, 197, 94, 0.4))">
    <path d="M 0 -70 C 50 -70 80 -40 80 15 C 80 75 0 105 0 105 C 0 105 -80 75 -80 15 C -80 -40 -50 -70 0 -70 Z" fill="#141b2b" stroke="url(#shieldGrad)" stroke-width="4"/>
    <!-- Checkmark -->
    <path d="M -30 15 L -10 38 L 35 -15" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Diagnostics Telemetry Card -->
  <g transform="translate(560, 240)">
    <rect x="0" y="0" width="180" height="130" rx="10" fill="rgba(20, 18, 48, 0.9)" stroke="#7c5cbf" stroke-width="2"/>
    <text x="18" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#00f2fe">HEALTH: 100%</text>
    <rect x="18" y="44" width="144" height="6" rx="3" fill="#2d225a"/>
    <rect x="18" y="44" width="144" height="6" rx="3" fill="#22c55e"/>

    <text x="18" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">UPTIME: 99.9%</text>
    <text x="18" y="98" font-family="system-ui, sans-serif" font-size="12" fill="#b9a3e3">AUTO-BACKUP: OK</text>
    <text x="18" y="118" font-family="system-ui, sans-serif" font-size="11" fill="#22c55e">PATCH v3.4 LIVE</text>
  </g>

  <!-- Floating Wrench / Maintenance Tool -->
  <g transform="translate(420, 280) rotate(-45)">
    <rect x="-10" y="-60" width="20" height="120" rx="6" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
    <!-- Open end head -->
    <path d="M -22 -60 C -22 -82 22 -82 22 -60 L 10 -55 L -10 -55 Z" fill="#64748b" stroke="#cbd5e1" stroke-width="2"/>
  </g>
</svg>
